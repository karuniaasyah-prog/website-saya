<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page Pintar</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        /* ======================================================= */
        /* TAMPILAN DEFAULT: JIKA DIBUKA DI LAPTOP / PC (DESKTOP)  */
        /* ======================================================= */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #ffffff; /* Latar belakang situs PUTIH */
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            color: #333333; 
        }
        .card { 
            background: #f5f5f5; /* Kartu abu-abu sangat muda */
            padding: 40px; 
            border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            text-align: center; 
            max-width: 400px; 
            width: 90%; 
        }
        h1 { font-size: 24px; color: #111111; margin-bottom: 10px; }
        p { color: #555555; font-size: 16px; margin-bottom: 25px; line-height: 1.5; }
        .btn { 
            display: inline-block; 
            background: #111111; 
            color: #ffffff; 
            padding: 12px 30px; 
            border-radius: 25px; 
            text-decoration: none; 
            font-weight: bold; 
            cursor: pointer;
            transition: 0.3s; 
        }
        .btn:hover { background: #444444; }

        /* ======================================================= */
        /* TAMPILAN KHUSUS: JIKA DIBUKA DI MOBILE / HP             */
        /* ======================================================= */
        @media (max-width: 767px) {
            body { 
                background: #121212; /* Latar belakang situs HITAM */
                color: #ffffff; 
            }
            .card { 
                background: #1e1e1e; /* Kartu hitam pekat */
                box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
            }
            h1 { color: #ffffff; }
            p { color: #bbbbbb; }
            .btn { 
                background: #ffffff; 
                color: #121212; 
            }
            .btn:hover { background: #eeeeee; }
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Rekomendasi Khusus</h1>
        <p>Klik tombol di bawah ini untuk langsung menuju ke situs resmi pilihan kami.</p>
        
        <button onclick="alihkanLink()" class="btn">Kunjungi Situs</button>
    </div>

    <script>
        function alihkanLink() {
            // 1. ATUR LINK KAMU DI SINI
            var linkRestoDesktop = "https://link-resto-pilihan-kamu.com"; // Ganti dengan link Resto
            var linkReferralMobile = "https://link-referral-kamu.com";    // Ganti dengan link Referral
            
            // 2. SISTEM MENGECEK APAKAH USER MENGGUNAKAN HP
            var isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth <= 767;
            
            // 3. EKSEKUSI PENGALIHAN
            if (isMobile) {
                // Jika dibuka di HP, buka Link Referral di tab baru
                window.open(https://gajian123.forum/account/register/192531007, '_blank');
            } else {
                // Jika dibuka di Laptop/PC, buka Link Resto di tab baru
                window.open(https://www.hanamasaresto.com/, '_blank');
            }
        }
    </script>

</body>
</html>
