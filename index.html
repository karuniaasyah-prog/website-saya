<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page Saya</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; justify-content: center; align-items: center; height: 100vh; color: #333; }
        .card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); text-align: center; max-width: 400px; width: 90%; }
        h1 { font-size: 24px; color: #4a148c; margin-bottom: 10px; }
        p { color: #666; font-size: 16px; margin-bottom: 25px; line-height: 1.5; }
        .btn { display: inline-block; background: #764ba2; color: white; padding: 12px 30px; border-radius: 25px; text-decoration: none; font-weight: bold; transition: 0.3s; box-shadow: 0 4px 15px rgba(118, 75, 162, 0.3); }
        .btn:hover { background: #5a328a; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="card">
        <h1>Website Resmi Saya</h1>
        <p>Selamat datang! Halaman ini berhasil dihosting menggunakan Cloudflare Pages dan terintegrasi otomatis dengan GitHub.</p>
        <a href="#" class="btn">Pelajari Selengkapnya</a>
    </div>
</body>
</html>
